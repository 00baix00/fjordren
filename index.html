<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Fjordren</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.container{
background:white;
max-width:700px;
margin:auto;
padding:40px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
color:#0a5c7a;
}

form{
margin-top:30px;
}

input, textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0a5c7a;
color:white;
border:none;
padding:12px 25px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#084a61;
}
</style>

</head>

<body>

<div class="container">

<h1>Fjordren</h1>

<p>
Nettsiden vår er for øyeblikket under utvikling.
</p>

<p>
Hvis du ønsker informasjon eller tilbud, kan du sende oss en melding via skjemaet nedenfor.
</p>

<form action="https://formsubmit.co/00baix00@gmail.com" method="POST">

<input type="text" name="name" placeholder="Navn og etternavn" required>

<input type="email" name="email" placeholder="Din e-post" required>

<textarea name="message" rows="6" placeholder="Melding..." required></textarea>

<button type="submit">Send melding</button>

</form>

</div>

</body>
</html>
